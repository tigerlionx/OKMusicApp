name: Build Android Release AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 3. Node.js + npm install ─────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 4. Android SDK — use the pre-installed SDK on ubuntu runners ─────
      - name: Set up Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            2>&1 | tail -5
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ── 4. Decode google-services.json from secret ───────────────────────
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json

      # ── 5. Decode keystore from secret ───────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/okmusic-release.keystore

      # ── 6. Write keystore.properties ─────────────────────────────────────
      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties << EOF
          storeFile=../okmusic-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ── 7. Capacitor sync — generates capacitor-cordova-android-plugins ──
      - name: Run cap sync android
        run: npx cap sync android

      # ── 8. Grant execute permission for gradlew ───────────────────────────
      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      # ── 9. Build release AAB ─────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew bundleRelease --stacktrace

      # ── 10. Upload AAB as artifact ────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: okmusic-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
