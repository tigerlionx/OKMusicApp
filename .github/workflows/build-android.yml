name: Build Android Release AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:   # also allow manual trigger from GitHub UI

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 3. Android SDK ───────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 4. Decode keystore from secret ───────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/okmusic-release.keystore

      # ── 5. Write keystore.properties ─────────────────────────────────────
      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../okmusic-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ── 6. Grant execute permission for gradlew ───────────────────────────
      - name: Grant Gradle permissions
        run: chmod +x android/gradlew

      # ── 7. Build release AAB ─────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      # ── 8. Upload AAB as artifact ─────────────────────────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: okmusic-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 9. Also upload mapping file if it exists (for Play Console) ──────
      - name: Upload mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okmusic-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
